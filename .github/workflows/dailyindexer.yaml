- name: GSC Indexer
  # You may pin to the exact commit or the version.
  # uses: toolsura/gsc-indexer@86dfea573298dfc7ec309c3e2a8c8fd64958381d
  uses: toolsura/gsc-indexer@v1
  with:
    # Service-account JSON key (its CONTENTS, not a path). Written to a temp file at chmod 600.
    service_account_json: 
    # Google API key. Optional — GSC's URL Inspection API requires OAuth, so prefer service_account_json.
    api_key: # optional
    # GSC property / site URL.
    site: # optional, default is https://www.toolsura.com/
    # Newline-separated list of URLs to inspect (passed as positional args).
    urls: # optional
    # A sitemap URL (ending in .xml). Auto-expanded by the CLI into every <loc> entry.
    sitemap: # optional
    # Delay between requests (Go duration, e.g. 1s, 10s).
    delay: # optional, default is 1s
    # Quiet mode: progress line + summary + errors only.
    quiet: # optional, default is false
    # Expand and list the URLs that would be inspected, then exit (no API calls).
    dry_run: # optional, default is false
    # Emit results as JSON.
    json: # optional, default is false
    # Color output: auto, always, or never.
    color: # optional, default is never
    # Write indexed.txt / not-indexed.txt / summary.json into this dir.
    report: # optional
    # Compare against a saved summary.json and report changes.
    diff: # optional
