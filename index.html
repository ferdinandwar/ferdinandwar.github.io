    <h3 style="text-align: left; padding-left: 20%;">Name searcher:&nbsp;<input id=name type="text" placeholder="Name" /></h3>
    <script>
        const nameInput = document.querySelector('#name');
        nameInput.addEventListener('keydown', async e => {
            if (e.key !== 'Enter') return;
            const name = nameInput.value.trim().toLowerCase();
            const data = await fetch('/database/names.json').then(r => r.json());
            (data.names[name])?location.href=data.names[name]:location.href="https://ferdinandwar.github.io/database/unknown.html";
        });
    </script>
